# Test-only additions to src/main/resources/application.yml (Spring Boot loads
# classpath:/config/application.yml on top of it). Never packaged in the jar.

app:
  # Random encryption key per test run (SecretCipherTest proves production
  # refuses to start without one).
  encryption:
    required: false
  # Emails inline, so tests can read them right after the request.
  mail:
    enabled: false
    async: false
  # The embedded fake SSH server listens on 127.0.0.1.
  servers:
    allow-private-ips: true
  # SMTP checks go to a FakeSmtpServer on 127.0.0.1 (its port is set by the test), with no waits.
  validation:
    allow-private-mx: true
    gap-scale: 0
    smtp-timeout: 3s
    worker-idle: 100ms
  # List uploads in a temp folder; small import chunks so tests cross chunk borders.
  lists:
    upload-dir: ${java.io.tmpdir}/masterdb-test-uploads
    min-free-disk: 1MB
    max-file-size: 1MB
    chunk-max: 64KB
    import-chunk: 3
