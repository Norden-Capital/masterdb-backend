# Local development only. `./mvnw spring-boot:run` activates this profile
# (spring-boot.run.profiles in pom.xml). Production runs the jar from the
# Docker image without it, so nothing here reaches the server.

# API docs at http://localhost:8080/api/docs (off by default, see application.yml).
app:
  docs:
    enabled: true

  # The Next.js dev server too.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://db.nordencapital.ca},http://localhost:3000

  # http://localhost:8080 is not HTTPS: a Secure cookie would never come back.
  auth:
    cookie:
      secure: false

  # No ENCRYPTION_KEY needed on your PC: a random key per run (2FA enrolments
  # are then lost at restart). Set ENCRYPTION_KEY to keep them.
  encryption:
    required: false

  # Links in emails point at `next dev`, and are printed in full in the log
  # (no email is sent locally).
  frontend-url: http://localhost:3000
  mail:
    enabled: false
    log-links: true
  # The embedded fake SSH server listens on 127.0.0.1.
  servers:
    allow-private-ips: true
