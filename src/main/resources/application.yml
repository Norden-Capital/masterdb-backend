spring:
  application:
    name: masterdb-backend

  # Local defaults for development only. In production docker-compose.yml sets
  # SPRING_DATASOURCE_URL/USERNAME/PASSWORD, and the password comes from the
  # server's .env (written by the deploy from a GitHub secret). Never put a real
  # password here: this repository is public.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masterdb}
    username: ${SPRING_DATASOURCE_USERNAME:masterdb}
    password: ${SPRING_DATASOURCE_PASSWORD:masterdb-local-dev}

  # Flyway owns the schema. Hibernate only checks that the entities match it,
  # and refuses to start if they do not.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # JSON (Jackson 3, so the feature maps are the tools.jackson.* ones).
  # Dates as ISO-8601 strings in UTC, never numeric timestamps; null fields
  # are left out. Use Instant in DTOs.
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-durations-as-timestamps: false

server:
  # Caddy on the host terminates TLS and forwards to 127.0.0.1:8080.
  forward-headers-strategy: native
  # /error is answered by ProblemErrorController (problem+json), never an HTML page.
  error:
    whitelabel:
      enabled: false

# Every log line carries the request id ("-" outside a request), from the
# MDC key set by RequestIdFilter. Slots into Boot's default pattern.
logging:
  pattern:
    correlation: "[%X{requestId:--}] "

# Only /actuator/health is reachable. The deploy waits on it.
management:
  endpoints:
    web:
      exposure:
        include: health

# API docs. Swagger UI is served by DocsController at /api/docs (no redirect);
# the OpenAPI JSON lives under /api like every other app endpoint. OFF unless
# switched on: the `local` profile (application-local.yml, active for
# ./mvnw spring-boot:run) or APP_DOCS_ENABLED=true. When off, every docs path
# answers 404 problem+json (DocsDisabledConfig).
app:
  docs:
    enabled: ${APP_DOCS_ENABLED:false}

  # Only the MasterDB website may call this API (ProxySecretFilter). Its server
  # sends X-Proxy-Secret with this value on every request; anything else gets
  # 401 PROXY_SECRET_INVALID. Only /actuator/health is open. The value is a
  # GitHub secret written to the server's .env by the deploy, and the same value
  # is set in Vercel. FAIL CLOSED: with no secret (or under 32 characters) the
  # application refuses to start. `required: false` is set only by the `local`
  # profile and the tests; there, no secret means the check is off.
  proxy:
    secret: ${PROXY_SECRET:}
    required: true

  # The first account, the Owner (auth/bootstrap/OwnerBootstrap). Read once at
  # startup and used only if the users table is empty; ignored forever after.
  # GitHub secrets written to the server's .env by the deploy. NO defaults on
  # purpose: unset = no account and a WARN line, never a fallback password.
  bootstrap:
    owner:
      email: ${BOOTSTRAP_OWNER_EMAIL:}
      password: ${BOOTSTRAP_OWNER_PASSWORD:}
      name: ${BOOTSTRAP_OWNER_NAME:}

  # Login and sessions (auth/, web/security/). The md_session cookie holds a
  # random token; the database keeps its hash and checks it on every request.
  # Durations: 30s, 15m, 12h, 7d.
  auth:
    session:
      # Unused this long → signed out.
      idle-timeout: ${APP_AUTH_SESSION_IDLE_TIMEOUT:12h}
      # Signed out after this long, however much the session is used.
      absolute-timeout: ${APP_AUTH_SESSION_ABSOLUTE_TIMEOUT:7d}
      # last_seen_at is written at most this often per session.
      touch-interval: 1m
    cookie:
      # HTTPS only. The `local` profile turns it off for plain-http development.
      secure: true
    lockout:
      # Wrong passwords in a row before the account is locked, and for how long.
      max-attempts: ${APP_AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      duration: ${APP_AUTH_LOCKOUT_DURATION:15m}
    # Invitation links work once and expire after this long.
    invite-ttl: 72h
    # Password-reset links likewise.
    reset-ttl: 30m
    two-factor:
      # Name shown in the authenticator app.
      issuer: MasterDB
      # Time between the password and the code, and wrong codes allowed in it.
      challenge-ttl: 10m
      max-attempts: 5
    rate-limit:
      # Login and 2FA-code attempts per client address (X-Client-IP from the
      # website), counted separately.
      per-minute: ${APP_AUTH_RATE_LIMIT_PER_MINUTE:10}
      per-hour: ${APP_AUTH_RATE_LIMIT_PER_HOUR:50}

  # The website, for links in emails (invite, password reset).
  frontend-url: ${APP_FRONTEND_URL:https://db.nordencapital.ca}

  # Emails (mail/), sent through Resend's HTTP API. RESEND_API_KEY is a GitHub
  # secret written to the server's .env; OPTIONAL: without it the app starts and
  # each email is a WARN line instead (link token masked). `enabled: false`
  # (local profile, tests) never sends; `log-links: true` (local only) prints
  # the full link so a developer can click it.
  mail:
    enabled: true
    from: ${APP_MAIL_FROM:MasterDB <no-reply@nordencapital.ca>}
    resend:
      api-key: ${RESEND_API_KEY:}
    log-links: false
    # Reset emails leave after the request, off its thread, so the answer to
    # "forgot password" takes the same time whether the account exists.
    async: true

  # Encrypts 2FA secrets at rest (crypto/SecretCipher): 64 hex characters, a
  # GitHub secret written to the server's .env. FAIL CLOSED like the proxy
  # secret: missing or malformed = the app refuses to start. Only the `local`
  # profile and the tests set `required: false` (then a random key per run).
  # NEVER change the key once set: enrolled authenticators would stop working.
  encryption:
    key: ${ENCRYPTION_KEY:}
    required: true

  # Activity log (activity/): entries older than this are deleted daily.
  activity:
    retention: 365d

  # Namecheap API (dns/namecheap/). The account (API user, username, encrypted
  # key) is saved in the app, not here. ClientIp must be this server's public
  # IPv4 and be whitelisted in Namecheap (Profile → Tools → API Access).
  namecheap:
    base-url: ${NAMECHEAP_API_URL:https://api.namecheap.com/xml.response}
    client-ip: ${NAMECHEAP_CLIENT_IP:147.93.4.107}
    timeout: 60s

  # DNS health checks (dns/health/): asked of these public resolvers, not the
  # server's own, so the result is what the rest of the internet sees.
  dns:
    resolvers: ${APP_DNS_RESOLVERS:1.1.1.1,8.8.8.8}
    timeout: 3s
    # Every domain re-checked daily (UTC).
    health-cron: "0 15 4 * * *"

  # Browsers may call this API only from these sites (CorsConfig).
  # Comma-separated. The `local` profile adds http://localhost:3000.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://db.nordencapital.ca}

springdoc:
  api-docs:
    path: /api/v3/api-docs
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}
  # Document only the app's own endpoints, not actuator.
  paths-to-match: /api/**
