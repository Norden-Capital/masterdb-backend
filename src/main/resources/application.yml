spring:
  application:
    name: masterdb-backend

  # Local defaults for development only. In production docker-compose.yml sets
  # SPRING_DATASOURCE_URL/USERNAME/PASSWORD, and the password comes from the
  # server's .env (written by the deploy from a GitHub secret). Never put a real
  # password here: this repository is public.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masterdb}
    username: ${SPRING_DATASOURCE_USERNAME:masterdb}
    password: ${SPRING_DATASOURCE_PASSWORD:masterdb-local-dev}

  # Flyway owns the schema. Hibernate only checks that the entities match it,
  # and refuses to start if they do not.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # JSON (Jackson 3, so the feature maps are the tools.jackson.* ones).
  # Dates as ISO-8601 strings in UTC, never numeric timestamps; null fields
  # are left out. Use Instant in DTOs.
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-durations-as-timestamps: false

server:
  # Caddy on the host terminates TLS and forwards to 127.0.0.1:8080.
  forward-headers-strategy: native
  # /error is answered by ProblemErrorController (problem+json), never an HTML page.
  error:
    whitelabel:
      enabled: false

# Every log line carries the request id ("-" outside a request), from the
# MDC key set by RequestIdFilter. Slots into Boot's default pattern.
logging:
  pattern:
    correlation: "[%X{requestId:--}] "

# Only /actuator/health is reachable. The deploy waits on it.
management:
  endpoints:
    web:
      exposure:
        include: health

# API docs. Swagger UI is served by DocsController at /api/docs (no redirect);
# the OpenAPI JSON lives under /api like every other app endpoint. OFF unless
# switched on: the `local` profile (application-local.yml, active for
# ./mvnw spring-boot:run) or APP_DOCS_ENABLED=true. When off, every docs path
# answers 404 problem+json (DocsDisabledConfig).
app:
  docs:
    enabled: ${APP_DOCS_ENABLED:false}

  # Only the MasterDB website may call this API (ProxySecretFilter). Its server
  # sends X-Proxy-Secret with this value on every request; anything else gets
  # 401 PROXY_SECRET_INVALID. Only /actuator/health is open. The value is a
  # GitHub secret written to the server's .env by the deploy, and the same value
  # is set in Vercel. FAIL CLOSED: with no secret (or under 32 characters) the
  # application refuses to start. `required: false` is set only by the `local`
  # profile and the tests; there, no secret means the check is off.
  proxy:
    secret: ${PROXY_SECRET:}
    required: true

  # Browsers may call this API only from these sites (CorsConfig).
  # Comma-separated. The `local` profile adds http://localhost:3000.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://db.nordencapital.ca}

springdoc:
  api-docs:
    path: /api/v3/api-docs
    enabled: ${app.docs.enabled}
  swagger-ui:
    enabled: ${app.docs.enabled}
  # Document only the app's own endpoints, not actuator.
  paths-to-match: /api/**
